# DigitalOcean App Platform spec for boxedin.
#
# DJANGO_SECRET_KEY is a SECRET: it is set when the app is created and App
# Platform stores it encrypted, so its value is not kept here. When updating
# the app from this file, copy the encrypted value (EV[...]) from the live
# spec first.
name: boxedin
region: sgp1

domains:
  - domain: boxedin.staging-site.au
    type: PRIMARY
    # staging-site.au is hosted on DigitalOcean DNS, so App Platform manages
    # the record and certificate.
    zone: staging-site.au

databases:
  - name: db
    engine: PG
    production: true
    cluster_name: db-postgresql-sgp1-fit
    db_name: boxedin
    db_user: boxedin

envs:
  - key: DJANGO_CONFIGURATION
    scope: RUN_TIME
    value: Production
  - key: DATABASE_URL
    scope: RUN_TIME
    value: ${db.DATABASE_URL}
  - key: DJANGO_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  # The custom domain plus the app's default ondigitalocean.app domain.
  - key: DJANGO_ALLOWED_HOSTS
    scope: RUN_TIME
    value: boxedin.staging-site.au,${APP_DOMAIN}
  - key: DJANGO_CSRF_TRUSTED_ORIGINS
    scope: RUN_TIME
    value: https://boxedin.staging-site.au,${APP_URL}

services:
  - name: web
    github:
      repo: goodtune/boxedin
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /collections/

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: goodtune/boxedin
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: python manage.py migrate --noinput
