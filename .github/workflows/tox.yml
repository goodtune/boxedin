name: Run Tox tests
# Runs on the self-hosted ephemeral runners (a fresh VM per job), scale set
# homelab-ubuntu. See goodtune/homelab, docs/runners.md.

on:
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: homelab-ubuntu

    steps:
      - uses: actions/checkout@v7

      # python-fontconfig is only published as an sdist, so it is compiled
      # against the system fontconfig (and freetype) headers.
      - name: Install fontconfig build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libfontconfig-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run Tox
        run: uvx tox
